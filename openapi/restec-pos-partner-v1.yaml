openapi: 3.1.0
info:
  title: Restec POS Partner API
  version: 1.0.0
  description: |
    Public interface for restaurant POS bill synchronization, external payment reporting,
    hosted payment sessions, reconciliation, and signed payment-status webhooks. Money uses integer minor units.
    Sign requests over `timestamp.METHOD.path.exact_raw_body`. Mutations are idempotent.
    The sandbox and production credential sets are isolated. Card data is entered only on the
    secure hosted payment page. A checkout redirect is never proof of payment; completion is
    asynchronous and authoritative only through a verified Restec webhook or status response.
servers:
  - url: https://sandbox-api.restec.example
    description: Placeholder; replace with the activated Restec sandbox hostname supplied during onboarding.
  - url: https://api.restec.example
    description: Placeholder; replace with the activated Restec production hostname supplied during go-live.
security: [{ bearerAuth: [], requestSignature: [] }]
tags:
  - { name: Bills, description: Create, update, and reconcile bills. }
  - { name: Payments, description: Report completed external payment facts. }
  - { name: Payment Sessions, description: Start and query secure hosted payment sessions. }
  - { name: Tables, description: Retrieve authorized table mappings. }
paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        {
          '200':
            {
              description: Healthy,
              content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } },
            },
        }
  /v1/locations/{location_id}/bills/{external_bill_id}:
    parameters:
      [
        { $ref: '#/components/parameters/LocationId' },
        { $ref: '#/components/parameters/ExternalBillId' },
        { $ref: '#/components/parameters/Timestamp' },
        { $ref: '#/components/parameters/Signature' },
        { $ref: '#/components/parameters/RequestId' },
        { $ref: '#/components/parameters/ContentType' },
      ]
    put:
      tags: [Bills]
      operationId: upsertBill
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/BillInput' } } },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/Bill' },
          '400': { $ref: '#/components/responses/Error' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '413': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '500': { $ref: '#/components/responses/Error' },
          '502': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
          '504': { $ref: '#/components/responses/Error' },
        }
    get:
      tags: [Bills]
      operationId: getBill
      responses:
        {
          '200': { $ref: '#/components/responses/Bill' },
          '400': { $ref: '#/components/responses/Error' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '413': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '500': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
  /v1/locations/{location_id}/bills/{external_bill_id}/external-payments:
    parameters:
      [
        { $ref: '#/components/parameters/LocationId' },
        { $ref: '#/components/parameters/ExternalBillId' },
        { $ref: '#/components/parameters/Timestamp' },
        { $ref: '#/components/parameters/Signature' },
        { $ref: '#/components/parameters/RequestId' },
        { $ref: '#/components/parameters/ContentType' },
        { $ref: '#/components/parameters/IdempotencyKey' },
      ]
    post:
      tags: [Payments]
      operationId: recordExternalPayment
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/ExternalPayment' } } },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/Bill' },
          '400': { $ref: '#/components/responses/Error' },
          '401': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '413': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '500': { $ref: '#/components/responses/Error' },
          '502': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
          '504': { $ref: '#/components/responses/Error' },
        }
  /v1/locations/{location_id}/bills/{external_bill_id}/payment-sessions:
    parameters:
      - { $ref: '#/components/parameters/LocationId' }
      - { $ref: '#/components/parameters/ExternalBillId' }
      - { $ref: '#/components/parameters/Timestamp' }
      - { $ref: '#/components/parameters/Signature' }
      - { $ref: '#/components/parameters/RequestId' }
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/Environment' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Payment Sessions]
      operationId: createPaymentSession
      description: |
        Creates a hosted payment session in `requires_customer_action`. Open the returned
        Restec checkout URL. Do not send PAN, CVV, expiry, PIN, OTP, or track data.
        One active or ambiguous hosted session is allowed per bill. Traditional completed
        payments may use only capacity not protected by that session.
        The route returns 404 while payment sessions are disabled for an environment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentSessionInput' }
      responses:
        '201':
          description: Customer action is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSessionCreated' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /v1/locations/{location_id}/payment-sessions/{payment_session_id}:
    parameters:
      - { $ref: '#/components/parameters/LocationId' }
      - { $ref: '#/components/parameters/PaymentSessionId' }
      - { $ref: '#/components/parameters/Timestamp' }
      - { $ref: '#/components/parameters/Signature' }
      - { $ref: '#/components/parameters/RequestId' }
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/Environment' }
    get:
      tags: [Payment Sessions]
      operationId: getPaymentSession
      description: |
        Returns the current authoritative Restec payment state. The signed GET body is empty.
        `expires_at` is a customer-action deadline; it does not by itself release financial
        capacity. Provider events and scheduler reconciliation determine terminal expiry.
      responses:
        '200':
          description: Current payment session state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSessionStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/locations/{location_id}/tables:
    parameters:
      [
        { $ref: '#/components/parameters/LocationId' },
        { $ref: '#/components/parameters/Timestamp' },
        { $ref: '#/components/parameters/Signature' },
        { $ref: '#/components/parameters/RequestId' },
        { $ref: '#/components/parameters/ContentType' },
      ]
    get:
      tags: [Tables]
      operationId: listTables
      responses:
        {
          '200':
            {
              description: Public table mappings,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          required: [request_id, data],
                          properties:
                            {
                              request_id: { type: string, pattern: '^req_' },
                              data:
                                {
                                  type: array,
                                  items:
                                    {
                                      type: object,
                                      required: [table_id, external_table_id, name, active],
                                      properties:
                                        {
                                          table_id: { type: string, pattern: '^tbl_' },
                                          external_table_id: { type: string },
                                          name: { type: string },
                                          active: { type: boolean },
                                        },
                                    },
                                },
                            },
                        },
                    },
                },
            },
          '401': { $ref: '#/components/responses/Error' },
          '400': { $ref: '#/components/responses/Error' },
          '403': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
          '413': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
          '500': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Restec partner credential
      description: Environment-specific credential issued once by Restec.
    requestSignature:
      {
        type: apiKey,
        in: header,
        name: X-Restec-Signature,
        description: HMAC-SHA256 `v1=<lowercase hex>` over `timestamp.METHOD.path.exact_raw_body`.,
      }
  parameters:
    LocationId:
      {
        name: location_id,
        in: path,
        required: true,
        schema: { type: string, pattern: '^loc_[A-Za-z0-9_]+$' },
      }
    ExternalBillId:
      {
        name: external_bill_id,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 128 },
      }
    PaymentSessionId:
      {
        name: payment_session_id,
        in: path,
        required: true,
        schema: { type: string, pattern: '^rps_(test|live)_[A-Za-z0-9]+$' },
      }
    Environment:
      {
        name: X-Restec-Environment,
        in: header,
        required: true,
        schema: { type: string, enum: [sandbox, production] },
      }
    Timestamp:
      {
        name: X-Restec-Timestamp,
        in: header,
        required: true,
        schema: { type: integer, format: int64 },
      }
    Signature:
      {
        name: X-Restec-Signature,
        in: header,
        required: true,
        schema: { type: string, pattern: '^v1=[0-9a-f]{64}$' },
      }
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema: { type: string, pattern: '^req_[A-Za-z0-9._:-]{4,123}$' }
      description: Unique for every HTTP attempt; never reuse it on a retry.
    ContentType:
      name: Content-Type
      in: header
      required: true
      schema: { type: string, const: application/json }
      description: Required on signed requests, including signed GET requests.
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 200 },
        description: Stable for every retry of the same logical mutation and body.,
      }
  schemas:
    Amount: { type: integer, minimum: 0, maximum: 2147483647 }
    Item:
      {
        type: object,
        additionalProperties: false,
        required: [external_item_id, name, quantity, unit_amount, total_amount],
        properties:
          {
            external_item_id: { type: string, minLength: 1, maxLength: 128 },
            name: { type: string, minLength: 1, maxLength: 200 },
            quantity: { type: integer, minimum: 1, maximum: 10000 },
            unit_amount: { $ref: '#/components/schemas/Amount' },
            total_amount: { $ref: '#/components/schemas/Amount' },
            notes: { type: string, maxLength: 500 },
          },
      }
    Totals:
      {
        type: object,
        additionalProperties: false,
        required: [subtotal, tax, service_charge, discount, tip, grand_total],
        properties:
          {
            subtotal: { $ref: '#/components/schemas/Amount' },
            tax: { $ref: '#/components/schemas/Amount' },
            service_charge: { $ref: '#/components/schemas/Amount' },
            discount: { $ref: '#/components/schemas/Amount' },
            tip: { $ref: '#/components/schemas/Amount' },
            grand_total: { $ref: '#/components/schemas/Amount' },
          },
      }
    BillInput:
      {
        type: object,
        additionalProperties: false,
        required: [external_table_id, version, currency, status, items, totals, occurred_at],
        properties:
          {
            external_table_id: { type: string, minLength: 1, maxLength: 128 },
            external_order_id: { type: string, minLength: 1, maxLength: 128 },
            version: { type: integer, minimum: 1 },
            currency: { type: string, pattern: '^[A-Z]{3}$' },
            status: { type: string, enum: [open, completed, cancelled] },
            order_status:
              {
                type: string,
                enum: [open, accepted, preparing, ready, served, completed, cancelled],
              },
            items:
              {
                type: array,
                minItems: 1,
                maxItems: 250,
                items: { $ref: '#/components/schemas/Item' },
              },
            totals: { $ref: '#/components/schemas/Totals' },
            occurred_at: { type: string, format: date-time },
            metadata:
              {
                type: object,
                additionalProperties: true,
                description: Maximum serialized size is 8 KB.,
              },
          },
      }
    ExternalPayment:
      {
        type: object,
        additionalProperties: false,
        required: [external_payment_id, method, amount, currency, status, occurred_at],
        properties:
          {
            external_payment_id: { type: string, minLength: 1, maxLength: 128 },
            method: { type: string, enum: [cash, card_terminal, wallet_terminal, voucher, other] },
            amount: { type: integer, minimum: 1, maximum: 2147483647 },
            currency: { type: string, pattern: '^[A-Z]{3}$' },
            status: { const: completed },
            occurred_at: { type: string, format: date-time },
            processor_reference: { type: string, maxLength: 200 },
            metadata:
              {
                type: object,
                additionalProperties: true,
                description: Maximum serialized size is 8 KB.,
              },
          },
      }
    PaymentSessionInput:
      type: object
      additionalProperties: false
      required: [amount_minor, currency, method]
      properties:
        amount_minor: { type: integer, minimum: 1, maximum: 2147483647 }
        currency: { const: PKR }
        method: { type: string, enum: [card] }
        customer:
          type: object
          additionalProperties: false
          properties:
            email: { type: string, format: email, maxLength: 254 }
            mobile: { type: string, pattern: '^\\+?[0-9][0-9 -]{6,18}[0-9]$' }
        return_context:
          type: object
          additionalProperties: false
          properties:
            pos_reference: { type: string, minLength: 1, maxLength: 128 }
      example:
        amount_minor: 10000
        currency: PKR
        method: card
        return_context: { pos_reference: POS-ORDER-1001 }
    PaymentSessionState:
      type: string
      enum:
        [
          requires_customer_action,
          processing,
          paid,
          failed,
          expired,
          cancelled,
          refunded,
          partially_refunded,
        ]
    PaymentSessionCreated:
      type: object
      additionalProperties: false
      required:
        [
          payment_session_id,
          location_id,
          external_bill_id,
          status,
          checkout_url,
          amount_minor,
          currency,
          method,
          expires_at,
          created_at,
        ]
      properties:
        payment_session_id: { type: string, pattern: '^rps_(test|live)_' }
        location_id: { type: string, pattern: '^loc_' }
        external_bill_id: { type: string }
        status: { const: requires_customer_action }
        checkout_url: { type: string, format: uri, description: Restec-hosted redirect URL }
        amount_minor: { type: integer, minimum: 1 }
        currency: { const: PKR }
        method: { const: card }
        expires_at:
          {
            type: string,
            format: date-time,
            description: Customer-action deadline; not standalone financial expiry proof.,
          }
        created_at: { type: string, format: date-time }
    PaymentSessionStatus:
      type: object
      additionalProperties: false
      required:
        [
          payment_session_id,
          location_id,
          external_bill_id,
          status,
          amount_minor,
          currency,
          method,
          expires_at,
          paid_at,
          failure,
        ]
      properties:
        payment_session_id: { type: string, pattern: '^rps_(test|live)_' }
        location_id: { type: string, pattern: '^loc_' }
        external_bill_id: { type: string }
        status: { $ref: '#/components/schemas/PaymentSessionState' }
        amount_minor: { type: integer, minimum: 1 }
        currency: { const: PKR }
        method: { const: card }
        expires_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        failure:
          oneOf:
            - { type: 'null' }
            - type: object
              additionalProperties: false
              required: [code]
              properties: { code: { type: string } }
    BillState:
      {
        type: object,
        required:
          [
            request_id,
            restec_bill_id,
            external_bill_id,
            external_table_id,
            sync_status,
            order_status,
            payment_status,
            table_session_status,
            currency,
            grand_total,
            amount_paid,
            amount_refunded,
            amount_due,
            version,
            reconciliation_status,
            updated_at,
          ],
        properties:
          {
            request_id: { type: string, pattern: '^req_' },
            restec_bill_id: { type: string, pattern: '^bil_' },
            external_bill_id: { type: string },
            external_table_id: { type: string },
            sync_status: { const: accepted },
            order_status:
              {
                type: string,
                enum: [open, accepted, preparing, ready, served, completed, cancelled],
              },
            payment_status:
              {
                type: string,
                enum:
                  [
                    unpaid,
                    payment_in_progress,
                    partially_paid,
                    paid,
                    partially_refunded,
                    refunded,
                    failed,
                  ],
              },
            table_session_status:
              { type: string, enum: [open, ordering, dining, payment_due, closing, closed] },
            currency: { type: string, pattern: '^[A-Z]{3}$' },
            grand_total: { $ref: '#/components/schemas/Amount' },
            amount_paid: { $ref: '#/components/schemas/Amount' },
            amount_refunded: { $ref: '#/components/schemas/Amount' },
            amount_due: { $ref: '#/components/schemas/Amount' },
            version: { type: integer, minimum: 1 },
            reconciliation_status: { type: string, enum: [matched, mismatch, review_required] },
            updated_at: { type: string, format: date-time },
          },
      }
    PartnerWebhookEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - event_version
        - occurred_at
        - environment
        - partner_id
        - location_id
        - external_bill_id
        - payment_reference
        - amount_minor
        - currency
        - payment_method
        - payment_status
        - bill
        - metadata
      properties:
        event_id: { type: string, pattern: '^evt_[A-Za-z0-9_]+$' }
        event_type:
          type: string
          enum:
            - payment.completed
            - payment.failed
            - payment.expired
            - payment.refunded
            - payment.partially_refunded
        event_version: { const: '1.0' }
        occurred_at: { type: string, format: date-time }
        environment: { type: string, enum: [sandbox, production] }
        partner_id: { type: string, pattern: '^ptr_[A-Za-z0-9_]+$' }
        location_id: { type: string, pattern: '^loc_[A-Za-z0-9_]+$' }
        external_bill_id: { type: string, minLength: 1, maxLength: 128 }
        payment_session_id: { type: string, pattern: '^rps_(test|live)_[A-Za-z0-9]+$' }
        payment_reference: { type: string, pattern: '^pay_[A-Za-z0-9_]+$' }
        amount_minor: { $ref: '#/components/schemas/Amount' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        payment_method:
          type: string
          enum: [card, wallet, cash, card_terminal, wallet_terminal, voucher, other]
        payment_status: { type: string, enum: [completed, failed, refunded] }
        bill:
          type: object
          additionalProperties: false
          required: [grand_total, amount_paid, amount_refunded, amount_due, payment_status, version]
          properties:
            grand_total: { $ref: '#/components/schemas/Amount' }
            amount_paid: { $ref: '#/components/schemas/Amount' }
            amount_refunded: { $ref: '#/components/schemas/Amount' }
            amount_due: { $ref: '#/components/schemas/Amount' }
            payment_status:
              {
                type: string,
                enum:
                  [
                    unpaid,
                    payment_in_progress,
                    partially_paid,
                    paid,
                    partially_refunded,
                    refunded,
                    failed,
                  ],
              }
            version: { type: integer, minimum: 1 }
        metadata: { type: object, additionalProperties: true }
      example:
        event_id: evt_example1001
        event_type: payment.completed
        event_version: '1.0'
        occurred_at: '2026-08-02T10:06:00Z'
        environment: sandbox
        partner_id: ptr_example
        location_id: loc_example
        external_bill_id: BILL-1001
        payment_session_id: rps_test_example1001
        payment_reference: pay_example1001
        amount_minor: 10000
        currency: PKR
        payment_method: card
        payment_status: completed
        bill:
          grand_total: 10000
          amount_paid: 10000
          amount_refunded: 0
          amount_due: 0
          payment_status: paid
          version: 2
        metadata: {}
    Health:
      {
        type: object,
        additionalProperties: false,
        required: [status, environment, version],
        properties:
          {
            status: { const: ok },
            environment: { enum: [sandbox, production, test] },
            version: { type: string },
          },
      }
    Error:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id, retryable, error]
      properties:
        type: { type: string, pattern: '^urn:restec:error:' }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - invalid_request
            - invalid_credentials
            - access_denied
            - resource_not_found
            - replay_detected
            - idempotency_conflict
            - bill_version_conflict
            - payment_in_progress
            - payment_capacity_conflict
            - bill_financial_floor_conflict
            - payment_outcome_ambiguous
            - bill_already_paid
            - payload_too_large
            - amount_mismatch
            - invalid_status_transition
            - bill_not_payable
            - amount_exceeds_balance
            - currency_not_supported
            - payment_method_not_available
            - payment_session_expired
            - payment_session_not_found
            - payment_session_already_completed
            - payment_confirmation_pending
            - invalid_checkout_destination
            - rate_limited
            - internal_error
            - dependency_unavailable
        request_id: { type: string, pattern: '^req_' }
        field_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        retryable: { type: boolean }
        retry_after_seconds: { type: integer, minimum: 0 }
        error:
          type: object
          deprecated: true
          description: Compatibility projection; new integrations use the top-level problem fields.
          required: [code, message, request_id, details]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }

  responses:
    Bill:
      {
        description: Canonical bill state,
        content: { application/json: { schema: { $ref: '#/components/schemas/BillState' } } },
      }
    Error:
      {
        description: Stable Restec error,
        headers:
          {
            X-Request-Id: { schema: { type: string } },
            Retry-After:
              {
                schema: { type: integer },
                description: Present when the caller must delay a retry.,
              },
          },
        content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } },
      }

webhooks:
  paymentStatusChanged:
    post:
      summary: Signed payment status event delivered to the POS webhook endpoint
      description: |
        Verify `X-Restec-Signature` over `timestamp.exact_raw_body`, durably store the
        event ID with a unique constraint, and acknowledge with 200, 201, 202, or 204.
        Close the invoice only when `payment_status` is `paid` and `amount_due` is zero.
        The canonical signing input is the ASCII timestamp, a period, and the exact request-body
        bytes: `timestamp.exact_raw_body`. Compute HMAC-SHA256 with the environment-specific
        webhook signing secret and compare `v1=<lowercase hex>` in constant time.
        Temporary failures are retried after 30 seconds, 2 minutes, 10 minutes, 30 minutes,
        2 hours, 6 hours, and 12 hours. The event ID and body stay unchanged.
      parameters:
        - {
            name: X-Restec-Event-Id,
            in: header,
            required: true,
            schema: { type: string, pattern: '^evt_' },
          }
        - { name: X-Restec-Timestamp, in: header, required: true, schema: { type: integer } }
        - {
            name: X-Restec-Signature,
            in: header,
            required: true,
            schema: { type: string, pattern: '^v1=[0-9a-f]{64}$' },
          }
        - {
            name: X-Restec-Environment,
            in: header,
            required: true,
            schema: { type: string, enum: [sandbox, production] },
          }
        - {
            name: X-Restec-Delivery-Attempt,
            in: header,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerWebhookEvent'
      responses:
        '200': { description: Durably accepted }
        '201': { description: Durably accepted }
        '202': { description: Durably accepted }
        '204': { description: Durably accepted without a response body }
